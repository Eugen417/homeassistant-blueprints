blueprint:
  name: Автоматический переключатель тарифов (2 и 3 зоны)
  description: >-
    Универсальный переключатель для счетчиков коммунальных услуг (Utility Meter).
    Названия тарифов берутся автоматически из атрибутов выбранного счетчика:
    1-й тариф — День/Пик, 2-й — Ночь, 3-й — Полупик.
  domain: automation
  source_url: https://raw.githubusercontent.com/Eugen417/homeassistant-blueprints/main/automation/energy/tariff_switcher.yaml
  input:
    tariff_entity:
      name: Счетчик (Utility Meter)
      description: Выберите ваш счетчик коммунальных услуг.
      selector:
        entity:
          filter:
            - domain: select
              integration: utility_meter

    tariff_mode:
      name: Тип тарификации
      description: >-
        "Авто" автоматически определит 2 или 3 зоны по количеству тарифов в счетчике.
      default: "auto"
      selector:
        select:
          options:
            - label: "Автоопределение (по числу тарифов в счетчике)"
              value: "auto"
            - label: "Двухтарифный (Т1 День / Т2 Ночь)"
              value: "2"
            - label: "Трехтарифный (Т1 Пик / Т2 Ночь / Т3 Полупик)"
              value: "3"
          mode: dropdown

    # Общие настройки времени (День / Ночь)
    day_start:
      name: Начало дня / Утреннего пика Т1
      description: "По умолчанию 07:00:00 (конец ночной зоны Т2)."
      default: "07:00:00"
      selector:
        time:
    night_start:
      name: Начало ночной зоны Т2
      description: "По умолчанию 23:00:00."
      default: "23:00:00"
      selector:
        time:

    # Настройки для 3-х тарифного режима
    peak1_end:
      name: "[3-тарифный] Конец утреннего пика (переход Т1 -> Т3)"
      description: "По умолчанию 10:00:00 (игнорируется при 2-тарифном режиме)."
      default: "10:00:00"
      selector:
        time:
    peak2_start:
      name: "[3-тарифный] Начало вечернего пика (переход Т3 -> Т1)"
      description: "По умолчанию 17:00:00 (игнорируется при 2-тарифном режиме)."
      default: "17:00:00"
      selector:
        time:
    peak2_end:
      name: "[3-тарифный] Конец вечернего пика (переход Т1 -> Т3)"
      description: "По умолчанию 21:00:00 (игнорируется при 2-тарифном режиме)."
      default: "21:00:00"
      selector:
        time:

mode: restart
max_exceeded: silent

variables:
  entity: !input tariff_entity
  mode_input: !input tariff_mode
  t_day_start: !input day_start
  t_night_start: !input night_start
  t_p1_end: !input peak1_end
  t_p2_start: !input peak2_start
  t_p2_end: !input peak2_end

  # Получаем список названий тарифов прямо из атрибутов сущности
  tariffs: "{{ state_attr(entity, 'options') | default([], true) }}"
  t1: "{{ tariffs[0] if tariffs | length > 0 else 'T1' }}"
  t2: "{{ tariffs[1] if tariffs | length > 1 else 'T2' }}"
  t3: "{{ tariffs[2] if tariffs | length > 2 else t2 }}"

  # Определяем итоговый режим (приводим к целому числу)
  mode_type: >-
    {% if mode_input == 'auto' %}
      {{ 3 if tariffs | length >= 3 else 2 }}
    {% else %}
      {{ mode_input | int }}
    {% endif %}

  # Вычисление правильного тарифа для текущего момента времени
  target_tariff: >-
    {% set now_time = now().strftime('%H:%M:%S') %}
    {% if (mode_type | int) == 2 or (tariffs | length < 3) %}
      {% if t_day_start <= now_time < t_night_start %}
        {{ t1 }}
      {% else %}
        {{ t2 }}
      {% endif %}
    {% else %}
      {% if now_time >= t_night_start or now_time < t_day_start %}
        {{ t2 }}
      {% elif (t_day_start <= now_time < t_p1_end) or (t_p2_start <= now_time < t_p2_end) %}
        {{ t1 }}
      {% else %}
        {{ t3 }}
      {% endif %}
    {% endif %}

triggers:
  - trigger: time
    at: !input day_start
  - trigger: time
    at: !input night_start
  - trigger: time
    at: !input peak1_end
  - trigger: time
    at: !input peak2_start
  - trigger: time
    at: !input peak2_end
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: !input tariff_entity
    not_to:
      - unavailable
      - unknown

conditions:
  # Сущность должна быть доступна
  - condition: not
    conditions:
      - condition: state
        entity_id: !input tariff_entity
        state:
          - unavailable
          - unknown
  # Срабатывать ТОЛЬКО если текущий тариф НЕ равен расчетному
  - condition: template
    value_template: "{{ states(entity) != target_tariff and target_tariff != '' }}"

actions:
  - action: select.select_option
    target:
      entity_id: !input tariff_entity
    data:
      option: "{{ target_tariff }}"
